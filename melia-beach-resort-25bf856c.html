<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meliá · SCM Performance Review</title>
<style>
:root{
  color-scheme: light;
  --navy:#1F3864; --blue:#2E5496; --accent:#4472C4;
  --ink:#1a1f2b; --mid:#5a6475; --line:#e3e7ee; --bg:#f7f8fb; --card:#fff;
  --on:#2E7D32; --off:#C62828; --warn:#E8A33D; --y25:#9BB0CE; --y26:#2E5496;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
header{border-bottom:3px solid var(--navy);padding-bottom:14px;display:flex;
  justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--mid);text-transform:uppercase}
h1{font-size:28px;line-height:1.25;margin:6px 0 5px;color:var(--navy);font-weight:800;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--mid)}
.lang{display:flex;gap:4px;flex-shrink:0}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--mid);padding:5px 13px;
  border-radius:7px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--navy);border-color:var(--navy);color:#fff}
nav{position:sticky;top:0;z-index:30;background:var(--bg);padding:11px 0 9px;
  border-bottom:1px solid var(--line);margin-bottom:22px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--mid);
  padding:7px 14px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.12s}
nav button:hover{border-color:var(--accent);color:var(--blue)}
nav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
section{display:none;animation:fade .18s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
h2{font-size:20px;color:var(--navy);margin:32px 0 4px;font-weight:750;letter-spacing:-.01em}
h2:first-child{margin-top:0}
h3{font-size:14.5px;color:var(--blue);margin:22px 0 8px;font-weight:700}
.lede{font-size:13.5px;color:var(--mid);margin:0 0 16px}
p{margin:0 0 11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:13px 0;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.hero{background:linear-gradient(135deg,#1F3864,#2E5496);color:#fff;border:none;padding:24px 26px}
.hero .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero h2{color:#fff;margin:8px 0 9px;font-size:23px;line-height:1.35}
.hero p{opacity:.92;margin:0;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px;margin:14px 0 4px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.kpi .lab{font-size:11px;color:var(--mid);font-weight:650}
.kpi .val{font-size:24px;font-weight:800;color:var(--navy);margin:4px 0 1px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.kpi .note{font-size:11px;color:var(--mid)}
.kpi.red .val{color:var(--off)} .kpi.green .val{color:var(--on)} .kpi.warn .val{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;margin:9px 0 4px}
th{background:var(--navy);color:#fff;font-weight:650;text-align:left;padding:8px 10px;font-size:12px;
  border:1px solid #1F3864;white-space:normal;word-break:keep-all}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscroll table{min-width:620px}
td .sub-med{color:#9aa6bb;font-weight:400;white-space:nowrap}
td{padding:7px 10px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
tbody tr:nth-child(even){background:#fbfcfe}
.pos{color:var(--on);font-weight:700} .neg{color:var(--off);font-weight:700}
.hm{overflow-x:auto;margin:10px 0 4px}
.hm table{font-size:12px;min-width:860px}
.hm th{padding:6px 4px;text-align:center;font-size:11px}
.hm th.rowh{text-align:left;min-width:150px;position:sticky;left:0;z-index:2}
.hm td{text-align:center;padding:8px 3px;font-weight:700;border-color:#eef1f6}
.hm td.rowh{text-align:left;font-weight:650;background:#fff;position:sticky;left:0;z-index:1;border-right:2px solid var(--line)}
.z0{background:#fff;color:#ccd2dd}.z1{background:#dbe5f5;color:#2b3a55}.z2{background:#b3c9ec;color:#1b2a45}
.z3{background:#7ea3dd;color:#fff}.z4{background:#4472C4;color:#fff}.z5{background:#25457f;color:#fff}
.legend{display:flex;gap:13px;align-items:center;font-size:11.5px;color:var(--mid);margin-top:7px;flex-wrap:wrap}
.legend i{display:inline-block;width:17px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid #e0e5ee}
.tl-row{display:grid;grid-template-columns:152px 1fr;gap:11px;align-items:center;margin-bottom:8px}
.tl-name{font-size:12.5px;font-weight:700;color:var(--navy);text-align:right}
.tl-bar{position:relative;height:26px;background:#f0f3f8;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.tl-seg{position:absolute;top:0;bottom:0;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;min-width:14px}
.tl-note{display:grid;grid-template-columns:152px 1fr;gap:11px;font-size:11.5px;color:var(--mid);margin:2px 0 8px}
.tl-note b{color:var(--ink);font-weight:650}
.tl-axis{display:grid;grid-template-columns:152px 1fr;gap:11px;font-size:10px;color:var(--mid);margin-top:2px}
.tl-months{display:grid;grid-template-columns:repeat(24,1fr);text-align:center}
.chartbox{position:relative;height:280px;margin:10px 0 4px}
.chartbox.sm{height:230px}
.callout{background:#eef4ff;border:1px solid #cfdefc;border-left:4px solid var(--accent);border-radius:8px;
  padding:13px 17px;margin:11px 0;font-size:13.5px}
.callout strong{color:var(--navy)}
.alert{background:#fdf0ef;border-color:#f3cfcb;border-left-color:var(--off)}
.good{background:#eef7ef;border-color:#c9e3cb;border-left-color:var(--on)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
.pill.on{background:#e8f5e9;color:#1b5e20;border-color:#bcdfbf}
.pill.off{background:#fdecea;color:#8e1b14;border-color:#f2c9c4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.picker{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.picker button{border:1px solid var(--line);background:var(--card);color:var(--mid);padding:9px 16px;
  border-radius:9px;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;transition:.12s}
.picker button:hover{border-color:var(--accent);color:var(--blue)}
.picker button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dist{margin:6px 0}
.dist-row{display:grid;grid-template-columns:82px 1fr 96px;gap:9px;align-items:center;margin-bottom:5px;font-size:12.5px}
.dist-lab{color:var(--mid);text-align:right;font-weight:600}
.dist-track{position:relative;height:20px;background:#f2f5f9;border-radius:4px;overflow:hidden}
.dist-fill{position:absolute;left:0;top:0;bottom:0;background:var(--y26);border-radius:4px}
.dist-ghost{position:absolute;left:0;top:0;bottom:0;border:1.5px dashed #9aa6bb;border-radius:4px;
  background:rgba(154,166,187,.10)}
.dist-val{font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums}
.swatch{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mini{font-size:11.5px;color:var(--mid);margin-top:6px}
.empty{padding:26px;text-align:center;color:var(--mid);font-size:13.5px;background:#fafbfd;border-radius:8px;
  border:1px dashed var(--line)}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.tl-row,.tl-axis{grid-template-columns:96px 1fr}h1{font-size:21px}}
footer{margin-top:40px;padding-top:15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mid);line-height:1.7}
body.showall section{display:block;animation:none}
body.showall nav{display:none}
body.showall section+section{margin-top:34px;padding-top:30px;border-top:2px solid var(--line)}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  nav,.lang,#btnPrint{display:none!important}
  section{display:block!important;animation:none}
  section+section{break-before:page;margin-top:0;padding-top:0;border-top:none}
  .card,.kpi,table,.chartbox{break-inside:avoid}
  .card{box-shadow:none}
  a{text-decoration:none;color:inherit}
}
</style>
</head>

  return '<span class="'+(v>=0?'pos':'neg')+'">'+s+'</span>';}

var charts={};
function destroy(id){if(charts[id]){try{charts[id].destroy();}catch(e){} delete charts[id];}}
/* 차트 생성 실패가 페이지 전체를 멈추지 않도록 감싼다 */
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el){console.warn('canvas not found: '+id);return null;}
  try{ return new Chart(el,cfg); }
  catch(e){ console.error('chart failed: '+id+' — '+e.message); return null; }
}

/* ─────────── 공통 조각 ─────────── */
function distHTML(cur,ref,labels,curLab,refLab){
  if(!cur||!cur.n)return '<div class="empty">'+T('데이터 없음','No data')+'</div>';
  var mx=1;
  labels.forEach(function(_,i){
    var a=cur.b[i]/cur.n*100; if(a>mx)mx=a;
    if(ref&&ref.n){var b=ref.b[i]/ref.n*100; if(b>mx)mx=b;}
  });
  var h='<div class="dist">';
  labels.forEach(function(L,i){
    var c=cur.b[i], cp=c/cur.n*100;
    var rp=(ref&&ref.n)?ref.b[i]/ref.n*100:null;
    h+='<div class="dist-row"><div class="dist-lab">'+L+'</div><div class="dist-track">';
    if(rp!==null)h+='<div class="dist-ghost" style="width:'+(rp/mx*100).toFixed(1)+'%"></div>';
    h+='<div class="dist-fill" style="width:'+(cp/mx*100).toFixed(1)+'%"></div></div>'+
       '<div class="dist-val">'+c+T('건',' bk')+' · '+cp.toFixed(0)+'%'+
       (rp!==null?' <span style="color:#9aa6bb">('+rp.toFixed(0)+'%)</span>':'')+'</div></div>';
  });
  return h+'</div><div class="mini"><span class="swatch" style="background:var(--y26)"></span>'+curLab+
    (ref&&ref.n?' &nbsp; <span class="swatch" style="border:1.5px dashed #9aa6bb;background:rgba(154,166,187,.1)"></span>'+refLab:'')+
    ' &nbsp;·&nbsp; '+T('평균','avg')+' '+cur.mean+' · '+T('중앙값','median')+' '+cur.med+'</div>';
}
function natHTML(nat,ref,refLab){
  if(!nat||!nat.length)return '<div class="empty">'+T('데이터 없음','No data')+'</div>';
  var rm={};if(ref)ref.forEach(function(x){rm[x.c]=x.pct;});
  var h='<div style="display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px">';
  nat.forEach(function(x){
    h+='<div title="'+natLab(x.c)+' '+x.pct+'%" style="width:'+x.pct+'%;background:'+(NATC[x.c]||'#9aa6bb')+
       ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700">'+
       (x.pct>=11?natLab(x.c):'')+'</div>';
  });
  h+='</div><table><tr><th>'+T('국적','Nationality')+'</th><th class="n">R/N</th><th class="n">'+
     T('비중','Share')+'</th><th class="n">'+refLab+'</th><th class="n">'+T('차이','Gap')+'</th></tr>';
  nat.forEach(function(x){
    var r=rm[x.c];
    h+='<tr><td><span class="swatch" style="background:'+(NATC[x.c]||'#9aa6bb')+'"></span>'+natLab(x.c)+'</td>'+
       '<td class="n">'+x.n+'</td><td class="n">'+x.pct+'%</td>'+
       '<td class="n">'+(r!==undefined?r+'%':'—')+'</td>'+
       '<td class="n">'+(r!==undefined?dlt(x.pct-r,'p'):'—')+'</td></tr>';
  });
  return h+'</table>';
}
function tbl(rows,cols){
  if(!rows||!rows.length)return '<div class="empty">'+T('데이터 없음','No data')+'</div>';
  var h='<table><tr>';cols.forEach(function(c){h+='<th class="'+(c[2]||'')+'">'+c[0]+'</th>';});h+='</tr>';
  rows.forEach(function(r){h+='<tr>';cols.forEach(function(c){h+='<td class="'+(c[2]||'')+'">'+c[1](r)+'</td>';});h+='</tr>';});
  return h+'</table>';
}

var curHotel=ORDER[0];
function kpiRow(a,b){
  function cell(lab,v25,v26,fmt,inv){
    var d=pctd(v26,v25);
    var cls=(d===null)?'':(((inv?-d:d)>=0)?'green':'red');
    return '<div class="kpi '+cls+'"><div class="lab">'+lab+'</div><div class="val">'+fmt(v26)+'</div>'+
           '<div class="note">2025 '+fmt(v25)+' · '+((d===null)?'—':dlt(d))+'</div></div>';
  }
  var f=function(v){return nf(v);};
  var fl=function(v){return (v===null||v===undefined)?'—':v.toFixed(2);};
  var fd=function(v){return (v===null||v===undefined)?'—':v.toFixed(1)+T('일',' d');};
  var A=a||{bk:0,rn:0,ttv:0,adr:0,los:0,lead:0},B=b||{bk:0,rn:0,ttv:0,adr:0,los:0,lead:0};
  return '<div class="kpis">'+
    cell(T('예약 건수','Bookings'),A.bk,B.bk,f)+
    cell('Room Night',A.rn,B.rn,f)+
    cell('TTV (₫)',A.ttv,B.ttv,function(v){return nf(Math.round(v));})+
    cell('ADR (₫)',A.adr,B.adr,f)+
    cell('LOS',A.los,B.los,fl)+
    cell(T('리드타임','Lead time'),A.lead,B.lead,fd)+'</div>';
}

        y1:{beginAtZero:true,position:'right',title:{display:true,text:'ADR (₫)'},grid:{display:false},

      nf(S.cancel['Da Nang'].cancelled)+'</td><td class="n"><strong>'+S.cancel['Da Nang'].rate+

/* ─────────── 프레임 ─────────── */
var TABS=[['s2',['예약 현황','Booking activity']],['s3',['호텔 드릴다운','Property drilldown']],
          ['s5',['Suggestion','Suggestions']]];
var cur='s2';
function renderAll(){
  document.documentElement.lang=LANG;
  document.getElementById('hTitle').textContent=T('Meliá Danang Beach Resort · 판매 현황','Meliá Danang Beach Resort · SCM Performance Review');
  document.getElementById('hSub').innerHTML='Meliá Danang Beach Resort &nbsp;·&nbsp; '+
    T('2026-09-13까지 생성된 예약 · 체크아웃 기준 · 취소 제외 · 통화 VND',
      'Bookings created on or before 13 Sep 2026 · checkout basis · cancellations excluded · VND');
  var nav=document.getElementById('nav');nav.innerHTML='';
  TABS.forEach(function(t){
    var b=document.createElement('button');b.textContent=T(t[1][0],t[1][1]);b.dataset.t=t[0];
    if(t[0]===cur)b.className='on';
    b.onclick=function(){show(t[0]);};
    nav.appendChild(b);
  });
  document.getElementById('foot').innerHTML=
    T('출처: OMH Global SCM 주간 예약 데이터(베트남, 2026-09-14 스냅샷) · 2026-09-13까지 생성된 예약 · 체크아웃 기준 · 취소 제외 · 통화 VND',
      'Source: OMH Global SCM weekly booking data (Vietnam, snapshot 14 Sep 2026) · bookings created on or before 13 Sep 2026 · checkout basis · cancellations excluded · VND');
  [['s2',renderS2],['s3',renderS3],['s5',renderS5]].forEach(function(r){
    try{ r[1](); }
    catch(e){
      console.error('render failed: '+r[0]+' — '+e.message);
      document.getElementById(r[0]).innerHTML=
        '<div class="empty">'+T('이 화면을 그리는 중 오류가 발생했습니다.','This section failed to render.')+'</div>';
    }
  });
  document.getElementById('btnPrint').textContent=SHOWALL?T('탭 보기','Tabs'):T('전체 보기','View all');
  if(SHOWALL){ setShowAll(true); } else { show(cur,true); }
}
function show(id,skipScroll){
  cur=id;
  ['s2','s3','s5'].forEach(function(s){
    document.getElementById(s).classList.toggle('on',s===id);});
  [].forEach.call(document.querySelectorAll('nav button'),function(b){
    b.classList.toggle('on',b.dataset.t===id);});
  if(!skipScroll)window.scrollTo({top:0,behavior:'instant'});
  setTimeout(function(){Object.keys(charts).forEach(function(k){
    try{charts[k].resize();}catch(e){}});},50);
}
var SHOWALL=false;
function setShowAll(on){
  SHOWALL=on;
  document.body.classList.toggle('showall',on);
  document.getElementById('btnPrint').textContent=
    on?T('탭 보기','Tabs'):T('전체 보기','View all');
  if(on){
    ['s2','s3','s5'].forEach(function(id){document.getElementById(id).classList.add('on');});
  }else{ show(cur,true); }
  /* 숨김 상태에서 만들어진 차트는 크기가 0이므로 다시 잡아준다 */
  setTimeout(function(){
    Object.keys(charts).forEach(function(k){try{charts[k].resize();}catch(e){}});
  },60);
}
function setLang(l){
  if(LANG===l)return;
  LANG=l;
  document.getElementById('bKo').classList.toggle('on',l==='ko');
  document.getElementById('bEn').classList.toggle('on',l==='en');
  renderAll();
}
document.getElementById('btnPrint').onclick=function(){setShowAll(!SHOWALL);};
document.getElementById('bKo').onclick=function(){setLang('ko');};
document.getElementById('bEn').onclick=function(){setLang('en');};
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  var ids=TABS.map(function(t){return t[0];});
  var i=ids.indexOf(cur);
  if(e.key==='ArrowRight'&&i<ids.length-1)show(ids[i+1]);
  if(e.key==='ArrowLeft'&&i>0)show(ids[i-1]);
});
renderAll();
})();
</script>
