<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sotetsu Grand Fresa Saigon · SCM Performance Review</title>
<style>
:root{
  color-scheme: light;
  --navy:#1F3864; --blue:#2E5496; --accent:#4472C4;
  --ink:#1a1f2b; --mid:#5a6475; --line:#e3e7ee; --bg:#f7f8fb; --card:#fff;
  --on:#2E7D32; --off:#C62828; --warn:#E8A33D; --y25:#9BB0CE; --y26:#2E5496;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
header{border-bottom:3px solid var(--navy);padding-bottom:14px;display:flex;
  justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--mid);text-transform:uppercase}
h1{font-size:28px;line-height:1.25;margin:6px 0 5px;color:var(--navy);font-weight:800;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--mid)}
.lang{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--mid);padding:5px 10px;
  border-radius:7px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--navy);border-color:var(--navy);color:#fff}
nav{position:sticky;top:0;z-index:30;background:var(--bg);padding:11px 0 9px;
  border-bottom:1px solid var(--line);margin-bottom:22px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--mid);
  padding:7px 14px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.12s}
nav button:hover{border-color:var(--accent);color:var(--blue)}
nav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
section{display:none;animation:fade .18s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
h2{font-size:20px;color:var(--navy);margin:32px 0 4px;font-weight:750;letter-spacing:-.01em}
h2:first-child{margin-top:0}
h3{font-size:14.5px;color:var(--blue);margin:22px 0 8px;font-weight:700}
.lede{font-size:13.5px;color:var(--mid);margin:0 0 16px}
p{margin:0 0 11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:13px 0;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.hero{background:linear-gradient(135deg,#1F3864,#2E5496);color:#fff;border:none;padding:24px 26px}
.hero .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero h2{color:#fff;margin:8px 0 9px;font-size:23px;line-height:1.35}
.hero p{opacity:.92;margin:0;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px;margin:14px 0 4px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.kpi .lab{font-size:11px;color:var(--mid);font-weight:650}
.kpi .val{font-size:24px;font-weight:800;color:var(--navy);margin:4px 0 1px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.kpi .note{font-size:11px;color:var(--mid)}
.kpi.red .val{color:var(--off)} .kpi.green .val{color:var(--on)} .kpi.warn .val{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;margin:9px 0 4px}
th{background:var(--navy);color:#fff;font-weight:650;text-align:left;padding:8px 10px;font-size:12px;
  border:1px solid #1F3864;white-space:normal;word-break:keep-all}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscroll table{min-width:620px}
td .sub-med{color:#9aa6bb;font-weight:400;white-space:nowrap}
td{padding:7px 10px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
tbody tr:nth-child(even){background:#fbfcfe}
.pos{color:var(--on);font-weight:700} .neg{color:var(--off);font-weight:700}
.hm{overflow-x:auto;margin:10px 0 4px}
.hm table{font-size:12px;min-width:860px}
.hm th{padding:6px 4px;text-align:center;font-size:11px}
.hm th.rowh{text-align:left;min-width:150px;position:sticky;left:0;z-index:2}
.hm td{text-align:center;padding:8px 3px;font-weight:700;border-color:#eef1f6}
.hm td.rowh{text-align:left;font-weight:650;background:#fff;position:sticky;left:0;z-index:1;border-right:2px solid var(--line)}
.z0{background:#fff;color:#ccd2dd}.z1{background:#dbe5f5;color:#2b3a55}.z2{background:#b3c9ec;color:#1b2a45}
.z3{background:#7ea3dd;color:#fff}.z4{background:#4472C4;color:#fff}.z5{background:#25457f;color:#fff}
.legend{display:flex;gap:13px;align-items:center;font-size:11.5px;color:var(--mid);margin-top:7px;flex-wrap:wrap}
.legend i{display:inline-block;width:17px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid #e0e5ee}
.tl-row{display:grid;grid-template-columns:152px 1fr;gap:11px;align-items:center;margin-bottom:8px}
.tl-name{font-size:12.5px;font-weight:700;color:var(--navy);text-align:right}
.tl-bar{position:relative;height:26px;background:#f0f3f8;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.tl-seg{position:absolute;top:0;bottom:0;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;min-width:14px}
.tl-note{display:grid;grid-template-columns:152px 1fr;gap:11px;font-size:11.5px;color:var(--mid);margin:2px 0 8px}
.tl-note b{color:var(--ink);font-weight:650}
.tl-axis{display:grid;grid-template-columns:152px 1fr;gap:11px;font-size:10px;color:var(--mid);margin-top:2px}
.tl-months{display:grid;grid-template-columns:repeat(24,1fr);text-align:center}
.chartbox{position:relative;height:280px;margin:10px 0 4px}
.chartbox.sm{height:230px}
.callout{background:#eef4ff;border:1px solid #cfdefc;border-left:4px solid var(--accent);border-radius:8px;
  padding:13px 17px;margin:11px 0;font-size:13.5px}
.callout strong{color:var(--navy)}
.alert{background:#fdf0ef;border-color:#f3cfcb;border-left-color:var(--off)}
.good{background:#eef7ef;border-color:#c9e3cb;border-left-color:var(--on)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
.pill.on{background:#e8f5e9;color:#1b5e20;border-color:#bcdfbf}
.pill.off{background:#fdecea;color:#8e1b14;border-color:#f2c9c4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.picker{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.picker button{border:1px solid var(--line);background:var(--card);color:var(--mid);padding:9px 16px;
  border-radius:9px;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;transition:.12s}
.picker button:hover{border-color:var(--accent);color:var(--blue)}
.picker button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dist{margin:6px 0}
.dist-row{display:grid;grid-template-columns:82px 1fr 96px;gap:9px;align-items:center;margin-bottom:5px;font-size:12.5px}
.dist-lab{color:var(--mid);text-align:right;font-weight:600}
.dist-track{position:relative;height:20px;background:#f2f5f9;border-radius:4px;overflow:hidden}
.dist-fill{position:absolute;left:0;top:0;bottom:0;background:var(--y26);border-radius:4px}
.dist-ghost{position:absolute;left:0;top:0;bottom:0;border:1.5px dashed #9aa6bb;border-radius:4px;
  background:rgba(154,166,187,.10)}
.dist-val{font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums}
.swatch{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mini{font-size:11.5px;color:var(--mid);margin-top:6px}
.empty{padding:26px;text-align:center;color:var(--mid);font-size:13.5px;background:#fafbfd;border-radius:8px;
  border:1px dashed var(--line)}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.tl-row,.tl-axis{grid-template-columns:96px 1fr}h1{font-size:21px}}
footer{margin-top:40px;padding-top:15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mid);line-height:1.7}
body.showall section{display:block;animation:none}
body.showall nav{display:none}
body.showall section+section{margin-top:34px;padding-top:30px;border-top:2px solid var(--line)}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  nav,.lang,#btnPrint{display:none!important}
  section{display:block!important;animation:none}
  section+section{break-before:page;margin-top:0;padding-top:0;border-top:none}
  .card,.kpi,table,.chartbox{break-inside:avoid}
  .card{box-shadow:none}
  a{text-decoration:none;color:inherit}
}
/* ─────────── 모바일 대응 ─────────── */
/* 표 폭 규칙 — fluid 는 그대로 줄바꿈, wide 는 열이 많아 더 넓게 */
.tscroll table.fluid{min-width:0}
.tscroll table.wide{min-width:760px}
.tscroll::-webkit-scrollbar{height:7px}
.tscroll::-webkit-scrollbar-track{background:#f1f4f9;border-radius:4px}
.tscroll::-webkit-scrollbar-thumb{background:#c3ccdb;border-radius:4px}

@media(max-width:760px){
  .wrap{padding:16px 12px 56px}
  header{padding-bottom:11px;gap:9px}
  h1{font-size:18.5px;line-height:1.3}
  .eyebrow{font-size:9.5px;letter-spacing:.1em}
  .sub{font-size:11.5px}
  .lang{width:100%;justify-content:flex-start}
  .lang button{padding:5px 11px;font-size:11.5px}
  nav{padding:9px 0 7px;margin-bottom:16px;gap:5px}
  nav button{padding:7px 13px;font-size:12.5px}
  h2{font-size:17px;margin:24px 0 4px}
  h3{font-size:13.5px;margin:18px 0 7px}
  .lede{font-size:12.5px;margin-bottom:13px}
  .card{padding:14px 13px;border-radius:10px;margin:11px 0}
  .hero{padding:18px 16px}
  .hero h2{font-size:18px;line-height:1.4}
  .hero p{font-size:13px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi{padding:11px 12px;border-radius:9px}
  .kpi .val{font-size:19px}
  .kpi .lab{font-size:10.5px}
  .kpi .note{font-size:10px;line-height:1.45}
  .chartbox{height:235px}
  .chartbox.sm{height:200px}
  table{font-size:12px}
  th{padding:7px 8px;font-size:11px}
  td{padding:6px 8px}
  .tscroll table{min-width:580px}
  .dist-row{grid-template-columns:56px 1fr 78px;gap:6px;font-size:11.5px}
  .dist-lab{font-size:11px}
  .dist-track{height:18px}
  .dist-val{font-size:10px}
  .callout{padding:11px 13px;font-size:12.5px;line-height:1.62}
  .mini{font-size:11px;line-height:1.55}
  .swatch{width:10px;height:10px}
  footer{font-size:10.5px;margin-top:28px}
  .pill{font-size:10px;padding:2px 7px}
  body.showall section+section{margin-top:24px;padding-top:22px}
}
/* 아주 좁은 화면 (360px 안팎) */
@media(max-width:400px){
  .wrap{padding:14px 10px 48px}
  h1{font-size:17px}
  .kpis{grid-template-columns:1fr 1fr;gap:7px}
  .kpi .val{font-size:17.5px}
  .chartbox{height:210px}
  .dist-row{grid-template-columns:48px 1fr 70px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow">OHMYHOTEL · GLOBAL SCM · VIETNAM</div>
    <h1 id="hTitle"></h1>
    <div class="sub" id="hSub"></div>
  </div>
  <div class="lang">
    <button id="b_ko" class="on">KO</button><button id="b_en">EN</button><button id="b_ja">JA</button><button id="b_vi">VI</button>
    <button id="btnPrint" style="margin-left:6px"></button>
  </div>
</header>
<nav id="nav"></nav>
<section id="s2"></section>
<section id="s3"></section>
<section id="s5"></section>
<footer id="foot"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script>
/* 한국어 원문을 키로 하는 일본어 · 베트남어 사전. 빠진 항목은 영어로 대체됩니다. */
var TR={};
TR.ja={
"데이터 없음":"データなし",
"건":"件",
"평균":"平均",
"중앙값":"中央値",
"국적":"国籍",
"비중":"構成比",
"차이":"差",
"본 호텔 소재 시장":"当ホテルの所在市場",
"일":"日",
"OMH 베트남 — 주요 지역 비중":"OMHベトナム — 主要エリア構成比",
"지역":"エリア",
"R/N 비중":"ルームナイト構成比",
"예약 비중":"予約構成比",
"평균 ADR (₫)":"平均ADR（₫）",
"평균 LOS":"平均宿泊日数",
"리드타임":"リードタイム",
"구간":"期間",
"가동 개월":"稼働月数",
"월평균 R/N":"月平均ルームナイト",
"8월 판매 개시 ~ 12월":"8月販売開始〜12月",
"2025년 8월 3일 첫 체크아웃으로 판매를 시작했기 때문에 2025년은 5개월치입니다. 연간 총합끼리 비교하면 의미가 없어 가동 개월 수로 나눴습니다.":"2025年8月3日の初チェックアウトから販売を開始したため、2025年は5か月分です。年間合計同士の比較では意味がないため、稼働月数で割っています。",
"작년 Q4 · 9/20 시점":"昨年Q4・9月20日時点",
"R/N — 최종은":"ルームナイト — 最終は",
"올해 Q4 · 9/20 시점":"今年Q4・9月20日時点",
"R/N — 작년 동시점보다 앞섬":"ルームナイト — 昨年同時点を上回る",
"호치민 시장 Q4 페이스":"ホーチミン市場Q4ペース",
"작년 동시점 대비":"昨年同時点比",
"Q4 판매 중인 호치민 호텔":"Q4を販売中のホーチミンのホテル",
"본 호텔 점유":"当ホテル保有",
"판매 개시 이후 추이":"販売開始以降の推移",
"2025년 8월에 OMH 판매를 시작한 시설이므로, 연간 총합이 아니라 가동 개월 기준으로 봅니다.":"2025年8月にOMHでの販売を開始した施設のため、年間合計ではなく稼働月ベースで見ます。",
"월평균 판매량이 두 배가 됐습니다.":"月平均の販売量が2倍になりました。",
"5.6박에서 11.4박으로 올라섰고, 예약 건수도 18건에서 59건으로 늘었습니다. 시작 단계는 지났다는 뜻입니다.":"5.6泊から11.4泊に伸び、予約件数も18件から59件に増えました。立ち上げ段階は過ぎたということです。",
"투숙(체크아웃) 월 기준 판매":"宿泊（チェックアウト）月別の販売",
"본 호텔":"当ホテル",
"4분기 예약 창이 지금 열려 있습니다":"第4四半期の予約ウィンドウは今開いています",
"작년 이 호텔의 4분기 16박은 전부 9월 20일 이후에 들어온 예약이었습니다. 즉 4분기는 지금부터 만들어집니다.":"昨年、当ホテルの第4四半期16泊はすべて9月20日以降に入った予約でした。つまり第4四半期はこれから作られます。",
"시장은 작년 같은 시점의 두 배로 차 있습니다.":"市場は昨年同時点の2倍まで埋まっています。",
"호치민 4분기 온더북이 작년 같은 시점 대비 2배로 늘었고, 이미 88개 호텔이 4분기를 팔고 있습니다. 작년 이 호텔은 4분기를 16박 잡았는데, 그때 ADR은 3,094,447₫으로 호치민 4분기 시장 평균 2,029,427₫보다 52% 높았습니다.":"ホーチミンの第4四半期のオンザブックは昨年同時点の2倍に増え、すでに88ホテルが第4四半期を販売しています。昨年、当ホテルは第4四半期に16泊を獲得しましたが、その際のADRは3,094,447₫で、ホーチミン第4四半期の市場平均2,029,427₫より52%高い水準でした。",
"예약 건수":"予約件数",
"지역 평균":"エリア平均",
"2026 vs 2025 · 2026은 온더북 · 2025는 8월 판매 개시":"2026 vs 2025・2026はオンザブック・2025は8月販売開始",
"2025년은 8월 3일 첫 체크아웃 이후 5개월치입니다. 증감률은 참고용이며, 가동 개월 기준 비교는 예약 현황 탭에 있습니다.":"2025年は8月3日の初チェックアウト以降の5か月分です。増減率は参考値であり、稼働月ベースの比較は「予約状況」タブにあります。",
"월별 판매현황 — 투숙(체크아웃) 월":"月別販売状況 — 宿泊（チェックアウト）月",
"막대 = R/N · 선 = ADR(₫). 2025는 확정, 2026은 9/20 기준 온더북입니다.":"棒＝ルームナイト・線＝ADR（₫）。2025年は確定、2026年は9月20日時点のオンザブックです。",
"투숙기간 (LOS)":"宿泊日数（LOS）",
"예약 리드타임":"予約リードタイム",
"투숙객 국적":"宿泊者の国籍",
"Sotetsu 투숙객 국적":"ソテツの宿泊者国籍",
"호치민 지역 내 투숙객 국적":"ホーチミン地域全体の宿泊者国籍",
"호치민 지역":"ホーチミン地域",
"일본인 비중이 시장의 4배입니다.":"日本人比率が市場の4倍です。",
"일본 16.2% vs 호치민 시장 3.9%. 브랜드 인지도가 실제 예약으로 나타나고 있습니다.":"日本16.2%に対しホーチミン市場は3.9%。ブランド認知が実際の予約として表れています。",
"룸타입":"ルームタイプ",

  return (g&&g[LANG])?g[LANG]:fallback;
}

var KEY='Sotetsu Saigon', RGN='Ho Chi Minh City', MAIN='#2E5496';
var MONTHS=['2025-01','2025-02','2025-03','2025-04','2025-05','2025-06','2025-07','2025-08','2025-09','2025-10','2025-11','2025-12',
            '2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];
var NATC={KR:'#2E5496',CN:'#C62828',JP:'#7E57C2',VN:'#2E7D32',TH:'#E8A33D',SEA:'#00897B',IN:'#F06292',WEST:'#5C6BC0',ETC:'#9aa6bb'};
var NAT_EN={KR:'Korea',CN:'China',JP:'Japan',VN:'Vietnam',TH:'Thailand',SEA:'SE Asia',IN:'India',WEST:'Western',ETC:'Other'};
var DOWK=['월','화','수','목','금','토','일'];
function natLab(c){
  if(LANG==='ko')return D.meta.catLabel[c]||c;
  if(LANG==='en')return NAT_EN[c]||c;
  var m=pick('nat',NAT_EN);
  return m[c]||NAT_EN[c]||c;
}
function mLab(){
  if(LANG==='ko')return ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var en=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return LANG==='en'?en:pick('m',en);
}
function losLab(){
  if(LANG==='ko')return D.meta.losL;
  var en=['1 night','2 nights','3 nights','4-5','6-7','8-14','15+'];
  return LANG==='en'?en:pick('los',en);
}
function leadLab(){
  if(LANG==='ko')return D.meta.leadL;
  var en=['Same day','1-3 d','4-7 d','8-14 d','15-30 d','31-60 d','61-90 d','91+ d'];
  return LANG==='en'?en:pick('lead',en);
}
function dowLab(){
  if(LANG==='ko')return DOWK;
  var en=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return LANG==='en'?en:pick('dow',en);
}

function nf(v){return (v===null||v===undefined)?'—':Number(v).toLocaleString('en-US');}
function pctd(a,b){if(!b)return null;return (a-b)/b*100;}
function dlt(v,suf){if(v===null||v===undefined)return '<span style="color:#9aa6bb">—</span>';
  var s=(v>=0?'+':'')+v.toFixed(1)+(suf||'%');
  return '<span class="'+(v>=0?'pos':'neg')+'">'+s+'</span>';}

/* 숨겨진 탭 안에서 캔버스를 그리면 크기가 0으로 잡혀 빈 상자가 됩니다.
   그래서 설정만 보관해 두었다가, 해당 구역이 실제로 보일 때 그립니다. */
var charts={}, pending={};
function destroy(id){
  if(charts[id]){try{charts[id].destroy();}catch(e){} delete charts[id];}
  delete pending[id];
}
function visible(el){
  var s=el.parentElement;
  while(s&&s.tagName!=='SECTION')s=s.parentElement;
  if(!s)return true;
  return s.classList.contains('on')||document.body.classList.contains('showall');
}
function mkChart(id,cfg){ pending[id]=cfg; flushCharts(); }
function drawPending(){
  Object.keys(pending).forEach(function(id){
    var el=document.getElementById(id);
    if(!el){delete pending[id];console.warn('canvas not found: '+id);return;}
    if(!visible(el))return;
    var cfg=pending[id]; delete pending[id];
    try{ charts[id]=new Chart(el,cfg); }
    catch(e){ console.error('chart failed: '+id+' — '+e.message); }
  });
  Object.keys(charts).forEach(function(k){try{charts[k].resize();}catch(e){}});
}
function isNarrow(){return (typeof window!=='undefined'&&window.innerWidth?window.innerWidth:1200)<700;}
/* x축 라벨을 자동으로 솎아내면 짝수 월이 사라집니다. 전부 표시하고 대신 기울입니다. */
function xTicks(n){
  var narrow=isNarrow();
  /* 라벨이 8개 이하면 어느 화면에서든 그냥 눕혀 둡니다. */
  var rot=(n<=8)?0:(narrow?90:(n>12?45:0));
  return {grid:{display:false},
    ticks:{autoSkip:false,maxRotation:rot,minRotation:rot,
      font:{size:narrow?(n<=8?10:8.5):(n>12?10:11)},padding:2}};
}
function flushCharts(){
  if(typeof requestAnimationFrame==='function'){
    requestAnimationFrame(function(){requestAnimationFrame(drawPending);});
  }else{ setTimeout(drawPending,0); }
  setTimeout(drawPending,80);
}

/* ─────────── 공통 조각 ─────────── */
function distHTML(cur,ref,labels,curLab,refLab){
  if(!cur||!cur.n)return '<div class="empty">'+T('데이터 없음','No data')+'</div>';
  var mx=1;
  labels.forEach(function(_,i){
    var a=cur.b[i]/cur.n*100; if(a>mx)mx=a;
    if(ref&&ref.n){var b=ref.b[i]/ref.n*100; if(b>mx)mx=b;}
  });
  var h='<div class="dist">';
  labels.forEach(function(L,i){
    var c=cur.b[i], cp=c/cur.n*100;
    var rp=(ref&&ref.n)?ref.b[i]/ref.n*100:null;
    h+='<div class="dist-row"><div class="dist-lab">'+L+'</div><div class="dist-track">';
    if(rp!==null)h+='<div class="dist-ghost" style="width:'+(rp/mx*100).toFixed(1)+'%"></div>';
    h+='<div class="dist-fill" style="width:'+(cp/mx*100).toFixed(1)+'%"></div></div>'+
       '<div class="dist-val">'+c+T('건',' bk')+' · '+cp.toFixed(0)+'%'+
       (rp!==null?' <span style="color:#9aa6bb">('+rp.toFixed(0)+'%)</span>':'')+'</div></div>';
  });
  return h+'</div><div class="mini"><span class="swatch" style="background:var(--y26)"></span>'+curLab+
    (ref&&ref.n?' &nbsp; <span class="swatch" style="border:1.5px dashed #9aa6bb;background:rgba(154,166,187,.1)"></span>'+refLab:'')+
    ' &nbsp;·&nbsp; '+T('평균','avg')+' '+cur.mean+' · '+T('중앙값','median')+' '+cur.med+'</div>';
}
/* 국적 구성 막대 하나 */
function natBar(arr){
  var h='<div style="display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px">';
  arr.forEach(function(x){
    h+='<div title="'+natLab(x.c)+' '+x.pct+'%" style="width:'+x.pct+'%;background:'+(NATC[x.c]||'#9aa6bb')+
       ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700">'+
       (x.pct>=11?natLab(x.c):'')+'</div>';
  });
  return h+'</div>';
}
/* 호텔 구성과 호치민 지역 구성을 위아래로 나란히 놓고, 표로 차이를 보여줍니다. */
function natHTML(nat,ref,refLab){
  if(!nat||!nat.length)return '<div class="empty">'+T('데이터 없음','No data')+'</div>';
  var rm={};if(ref)ref.forEach(function(x){rm[x.c]=x.pct;});
  var cap='font-size:11.5px;font-weight:700;color:var(--blue);margin:2px 0 5px';
  var h='<div style="'+cap+'">'+T('Sotetsu 투숙객 국적','Sotetsu guest nationality')+'</div>'+natBar(nat);
  if(ref&&ref.length){
    h+='<div style="'+cap+';color:var(--mid)">'+
       T('호치민 지역 내 투숙객 국적','Guest nationality across Ho Chi Minh City')+'</div>'+natBar(ref);
  }
  h+='<table class="fluid"><tr><th>'+T('국적','Nationality')+'</th><th class="n">R/N</th><th class="n">'+
     T('비중','Share')+'</th><th class="n">'+refLab+'</th><th class="n">'+T('차이','Gap')+'</th></tr>';
  nat.forEach(function(x){
    var r=rm[x.c];
    h+='<tr><td><span class="swatch" style="background:'+(NATC[x.c]||'#9aa6bb')+'"></span>'+natLab(x.c)+'</td>'+
       '<td class="n">'+x.n+'</td><td class="n">'+x.pct+'%</td>'+
       '<td class="n">'+(r!==undefined?r+'%':'—')+'</td>'+
       '<td class="n">'+(r!==undefined?dlt(x.pct-r,'p'):'—')+'</td></tr>';
  });
  /* 호텔에는 없고 지역에만 있는 국적도 비교에 필요하므로 아래에 덧붙입니다. */
  var have={};nat.forEach(function(x){have[x.c]=1;});
  (ref||[]).forEach(function(x){
    if(have[x.c]||!x.pct)return;
    h+='<tr style="color:#9aa6bb"><td><span class="swatch" style="background:'+(NATC[x.c]||'#9aa6bb')+
       ';opacity:.45"></span>'+natLab(x.c)+'</td><td class="n">0</td><td class="n">0%</td>'+
       '<td class="n">'+x.pct+'%</td><td class="n">'+dlt(-x.pct,'p')+'</td></tr>';
  });
  return h+'</table>';
}
/* 모바일에서 표가 뭉개지지 않도록, 넓은 표는 가로 스크롤 상자에 넣습니다.
   fluid = 열이 적어 그대로 줄바꿈해도 되는 표 / wide = 열이 많아 더 넓게 잡는 표 */
function wrapTables(id){
  var sec=document.getElementById(id);
  if(!sec)return;
  [].forEach.call(sec.querySelectorAll('table'),function(t){
    var p=t.parentElement;
    if(p&&p.classList&&p.classList.contains('tscroll'))return;
    var w=document.createElement('div');
    w.className='tscroll';
    p.insertBefore(w,t);
    w.appendChild(t);
  });
}
function tbl(rows,cols){
  if(!rows||!rows.length)return '<div class="empty">'+T('데이터 없음','No data')+'</div>';
  var h='<table class="fluid"><tr>';cols.forEach(function(c){h+='<th class="'+(c[2]||'')+'">'+c[0]+'</th>';});h+='</tr>';
  rows.forEach(function(r){h+='<tr>';cols.forEach(function(c){h+='<td class="'+(c[2]||'')+'">'+c[1](r)+'</td>';});h+='</tr>';});
  return h+'</table>';
}

function kpiRow(a,b){
  function cell(lab,v25,v26,fmt,inv){
    var d=pctd(v26,v25);
    var cls=(d===null)?'':(((inv?-d:d)>=0)?'green':'red');
    return '<div class="kpi '+cls+'"><div class="lab">'+lab+'</div><div class="val">'+fmt(v26)+'</div>'+
           '<div class="note">2025 '+fmt(v25)+' · '+((d===null)?'—':dlt(d))+'</div></div>';
  }
  var f=function(v){return nf(v);};
  var fl=function(v){return (v===null||v===undefined)?'—':v.toFixed(2);};
  var fd=function(v){return (v===null||v===undefined)?'—':v.toFixed(1)+T('일',' d');};
  var A=a||{bk:0,rn:0,ttv:0,adr:0,los:0,lead:0},B=b||{bk:0,rn:0,ttv:0,adr:0,los:0,lead:0};
  return '<div class="kpis">'+
    cell(T('예약 건수','Bookings'),A.bk,B.bk,f)+
    cell('Room Night',A.rn,B.rn,f)+
    cell('TTV (₫)',A.ttv,B.ttv,function(v){return nf(Math.round(v));})+
    cell('ADR (₫)',A.adr,B.adr,f)+
    cell('LOS',A.los,B.los,fl)+
    cell(T('리드타임','Lead time'),A.lead,B.lead,fd)+'</div>';
}

      T('본 호텔 주중 ADR은 3,089,276₫, 주말은 2,628,786₫입니다. 시장은 주중 2,422,146₫ · 주말 2,373,666₫으로 거의 차이가 없습니다. 호치민 숙박의 70.9%가 월~금에 발생하는데 본 호텔은 58.6%에 그칩니다 — 가장 큰 수요층에 가장 높은 가격을 제시하고 있는 구조입니다.',
        'Weekday ADR here is 3,089,276₫ against 2,628,786₫ at weekends. The market is effectively flat: 2,422,146₫ weekday, 2,373,666₫ weekend. 70.9% of all HCMC nights fall Monday to Friday, but only 58.6% here — the highest price is being quoted to the largest pool of demand.')+'</div>'+
    '<div class="callout">'+T('주중 요금은 새 수요를 만드는 것이 아니라 <strong>이미 시장에 있는 수요를 가져오는 장치</strong>입니다. 월~목 전용 요금만으로도 시장 평균 수준의 주중 비중에 접근할 수 있습니다.',
      'A weekday rate does not create new demand — it <strong>captures demand that is already in the market.</strong> A Monday-to-Thursday rate alone would move the weekday mix toward the market average.')+'</div></div>'+

    '<h2>'+T('근거 3 · 요금 포지션 — 12개월 모두 시장 위에 있습니다',
      'Evidence 3 · Rate position — above the market in all twelve months')+'</h2>'+
    '<div class="card">'+t3+
    '<div class="chartbox"><canvas id="cAdr"></canvas></div>'+
    '<div class="callout good" style="margin-top:12px"><strong>'+
      T('먼저 인정할 부분이 있습니다.','Credit where it is due.')+'</strong> '+
      T('작년 이 호텔의 ADR은 시장 평균보다 56% 높았는데 올해는 26%까지 좁혔습니다. 그 사이 판매량이 두 배가 된 것은 우연이 아닙니다. 요청드리는 것은 추가 인하가 아니라, 남은 격차를 <strong>상시 인하가 아닌 조건부 프로모션으로</strong> 메우자는 것입니다.',
        "Last year this property's ADR was 56% above the market average; this year it is 26%. The doubling of volume over the same period is not a coincidence. We are not asking for a further cut — we are asking to close the remaining gap with <strong>conditional promotions rather than a permanent reduction.</strong>")+'</div>'+
    '<div class="mini">'+T('막대 = 본 호텔 월별 ADR · 선 = 호치민 시장 월별 ADR (2026년 온더북 기준)',
      'Bars = property ADR by month · line = HCMC market ADR by month (2026 on the books)')+'</div></div>'+

    '<h2>'+T('근거 4 · 2027년 — 시장은 이미 팔고 있습니다','Evidence 4 · 2027 — the market is already selling it')+'</h2>'+
    '<div class="card">'+t4+
    '<div class="callout alert" style="margin-top:12px"><strong>'+
      T('2027년 1분기는 작년보다 17.9% 높은 단가에 팔리고 있습니다.','Q1 2027 is booking 17.9% higher than the same point a year ago.')+'</strong> '+
      T('호치민 2027년 1분기 온더북 ADR은 3,080,489₫로, 1년 전 같은 시점의 2,612,314₫보다 높습니다. 일찍 여는 것이 싸게 파는 것을 뜻하지 않습니다 — 오히려 지금 등록한 호텔들이 더 비싸게 팔고 있습니다.',
        'HCMC Q1 2027 is on the books at an ADR of 3,080,489₫ versus 2,612,314₫ at the same point a year earlier. Opening early does not mean selling cheap — the hotels that have loaded 2027 are selling at higher rates.')+'</div></div>'+

    '<h2>'+T('기대 효과','Expected impact')+'</h2>'+
    '<div class="card">'+kpi+
    '<div class="callout" style="margin-top:6px">'+
      TF('1박 예약 비중이 {a}%로 호치민 시장 {b}%보다 크게 높습니다. 이 {c}건이 2박으로만 바뀌어도 예약 건수 변화 없이 R/N이 {d}박 늘어납니다.',
         'Single-night bookings are {a}% here versus {b}% for the HCMC market. Converting those {c} bookings to two nights adds {d} room nights with no change in booking count.',
         {a:me.onePct,b:mk.onePct,c:me.one,d:me.rnM2N-me.rn})+'</div>'+
    '<div class="mini">'+T('2026년 온더북 실적에 M2N만 적용한 단순 환산입니다. 동계 프로모션 · 주중 요금 · 2027년 선등록 효과는 포함하지 않았습니다.',
      'A simple conversion applying M2N alone to the 2026 on-the-books figures. It excludes any effect from the winter promotion, weekday rates or loading 2027.')+'</div></div>';

  destroy('cQ4');
  mkChart('cQ4',{type:'bar',
    data:{labels:mLab(),datasets:[
      {label:T('2025 시장 (확정)','2025 market (final)'),data:D.regions[RGN].y['2025'].monthly.map(function(x){return x.rn;}),
       backgroundColor:'#9BB0CE',borderRadius:3},
      {label:T('2026 시장 (온더북)','2026 market (on the books)'),data:D.regions[RGN].y['2026'].monthly.map(function(x){return x.rn;}),
       backgroundColor:MAIN,borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle',padding:12}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:'Room Night'},grid:{color:'#eef1f6'}},x:xTicks(12)}}});

  destroy('cDow');
  mkChart('cDow',{
    data:{labels:DL,datasets:[
      {type:'bar',label:T('본 호텔 숙박 비중','This property'),
       data:dw.hotel.n.map(function(v){return +(v/dw.hotel.nights*100).toFixed(1);}),
       backgroundColor:MAIN,borderRadius:3},
      {type:'line',label:T('호치민 시장 평균','HCMC market avg'),
       data:dw.rgn.n.map(function(v){return +(v/dw.rgn.nights*100).toFixed(1);}),
       borderColor:'#9aa6bb',borderDash:[5,4],borderWidth:2,pointRadius:0,tension:.25}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle',padding:12}},
        tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+c.parsed.y+'%';}}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:T('숙박일 비중','Share of room nights')},
        ticks:{callback:function(v){return v+'%';}},grid:{color:'#eef1f6'}},x:xTicks(7)}}});

  destroy('cAdr');
  mkChart('cAdr',{
    data:{labels:mLab(),datasets:[
      {type:'bar',label:T('본 호텔 ADR','Property ADR'),data:ad.hotelM.map(function(v){return v||null;}),
       backgroundColor:MAIN,borderRadius:3},
      {type:'line',label:T('호치민 시장 ADR','HCMC market ADR'),data:ad.rgnM,
       borderColor:'#E8A33D',borderWidth:2,pointRadius:2.5,tension:.25}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle',padding:12}},
        tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+(c.parsed.y===null?'—':nf(c.parsed.y));}}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:'ADR (₫)'},grid:{color:'#eef1f6'},
        ticks:{callback:function(v){return (v/1e6).toFixed(1)+'M';}}},x:xTicks(12)}}});
}

/* ─────────── 프레임 ─────────── */
var TABS=[['s2',['예약 현황','Booking activity']],['s3',['호텔 드릴다운','Property drilldown']],
          ['s5',['Suggestion','Suggestions']]];
var cur='s2';
function renderAll(){
  document.documentElement.lang=LANG;
  document.getElementById('hTitle').textContent=T('Sotetsu Grand Fresa Saigon · 판매 현황','Sotetsu Grand Fresa Saigon · SCM Performance Review');
  document.getElementById('hSub').innerHTML='Ho Chi Minh City · Dynamic Rate &nbsp;·&nbsp; '+
    T('2026-09-20까지 생성된 예약 · 체크아웃 기준 · 취소 제외 · 통화 VND',
      'Bookings created on or before 20 Sep 2026 · checkout basis · cancellations excluded · VND');
  var nav=document.getElementById('nav');nav.innerHTML='';
  TABS.forEach(function(t){
    var b=document.createElement('button');b.textContent=T(t[1][0],t[1][1]);b.dataset.t=t[0];
    if(t[0]===cur)b.className='on';
    b.onclick=function(){show(t[0]);};
    nav.appendChild(b);
  });
  document.getElementById('foot').innerHTML=
    T('출처: OMH Global SCM 주간 예약 데이터(베트남, 2026-09-21 스냅샷) · 2026-09-20까지 생성된 예약 · 체크아웃 기준 · 취소 제외 · 통화 VND · 지역 평균은 호치민 전체 판매 호텔 기준입니다.',
      'Source: OMH Global SCM weekly booking data (Vietnam, snapshot 21 Sep 2026) · bookings created on or before 20 Sep 2026 · checkout basis · cancellations excluded · VND · market averages cover all hotels selling in Ho Chi Minh City.');
  [['s2',renderS2],['s3',renderS3],['s5',renderS5]].forEach(function(r){
    try{ r[1](); wrapTables(r[0]); }
    catch(e){
      console.error('render failed: '+r[0]+' — '+e.message);
      document.getElementById(r[0]).innerHTML=
        '<div class="empty">'+T('이 화면을 그리는 중 오류가 발생했습니다.','This section failed to render.')+'</div>';
    }
  });
  document.getElementById('btnPrint').textContent=SHOWALL?T('탭 보기','Tabs'):T('전체 보기','View all');
  if(SHOWALL){ setShowAll(true); } else { show(cur,true); }
}
function show(id,skipScroll){
  cur=id;
  ['s2','s3','s5'].forEach(function(s){
    document.getElementById(s).classList.toggle('on',s===id);});
  [].forEach.call(document.querySelectorAll('nav button'),function(b){
    b.classList.toggle('on',b.dataset.t===id);});
  if(!skipScroll)window.scrollTo({top:0,behavior:'instant'});
  flushCharts();
}
var SHOWALL=false;
function setShowAll(on){
  SHOWALL=on;
  document.body.classList.toggle('showall',on);
  document.getElementById('btnPrint').textContent=on?T('탭 보기','Tabs'):T('전체 보기','View all');
  if(on){ ['s2','s3','s5'].forEach(function(id){document.getElementById(id).classList.add('on');}); }
  else { show(cur,true); }
  flushCharts();
}
function setLang(l){
  if(LANG===l)return;
  LANG=l;
  LANGS.forEach(function(x){
    var b=document.getElementById('b_'+x[0]);
    if(b)b.classList.toggle('on',x[0]===l);
  });
  renderAll();
}
document.getElementById('btnPrint').onclick=function(){setShowAll(!SHOWALL);};
LANGS.forEach(function(x){
  var b=document.getElementById('b_'+x[0]);
  if(b)b.onclick=function(){setLang(x[0]);};
});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  var ids=TABS.map(function(t){return t[0];});
  var i=ids.indexOf(cur);
  if(e.key==='ArrowRight'&&i<ids.length-1)show(ids[i+1]);
  if(e.key==='ArrowLeft'&&i>0)show(ids[i-1]);
});
renderAll();
window.addEventListener('resize',function(){flushCharts();});
})();

</script>
</body>
</html>
